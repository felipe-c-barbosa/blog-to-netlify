[build]
  command = "jekyll build"
  publish = "_site"

[build.environment]
  RUBY_VERSION = "3.2.0"
  JEKYLL_ENV = "production"

# Redireciona www para apex domain
[[redirects]]
  from = "https://www.felipebarbosa.me/*"
  to = "https://felipebarbosa.me/:splat"
  status = 301
  force = true

# Security headers (fonte de verdade — não usar _headers do Jekyll)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://js-na1.hs-scripts.com https://js.hs-scripts.com https://js.hsforms.net https://js.hs-analytics.net https://js.hsadspixel.net https://js.hubspot.com https://js.hscollectedforms.net https://*.usemessages.com https://*.hs-banner.com https://cdn.segment.com https://identity.netlify.com https://unpkg.com https://fonts.googleapis.com https://cdn.jsdelivr.net https://platform.twitter.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://stats.g.doubleclick.net https://cdn.segment.com https://api.segment.io https://*.hubspot.com https://*.hubapi.com https://*.hsforms.com https://*.hscollectedforms.net https://*.hs-banner.com https://*.usemessages.com wss://*.hubspot.com https://identity.netlify.com https://api.netlify.com; frame-src 'self' https://*.hsforms.com https://*.hubspot.com https://identity.netlify.com https://platform.twitter.com https://www.youtube.com https://www.youtube-nocookie.com https://www.linkedin.com https://giphy.com https://www.slideshare.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://*.hsforms.com https://*.hubspot.com"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
