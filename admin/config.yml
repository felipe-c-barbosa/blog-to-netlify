backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "pt"

collections:
  - name: "posts"
    label: "Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Autor", name: "author", widget: "hidden", default: "Felipe Barbosa" }
      - label: "Permalink"
        name: "permalink"
        widget: "string"
        hint: "URL personalizada do post, ex: /meu-artigo/"
      - label: "Categoria"
        name: "categories"
        widget: "select"
        options:
          - { label: "Marketing", value: "marketing" }
          - { label: "Business", value: "business" }
          - { label: "Produto", value: "produto" }
      - label: "Description (SEO)"
        name: "description"
        widget: "text"
        required: false
        hint: "Meta description ~150–160 caracteres. Se vazio, usa o primeiro parágrafo."
      - label: "Last modified at"
        name: "last_modified_at"
        widget: "datetime"
        required: false
        hint: "Preencher só quando o conteúdo for de fato atualizado."
        date_format: "YYYY-MM-DD"
        time_format: false
      - { label: "Conteúdo", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Páginas"
    editor:
      preview: false
    files:
      - name: "sobre"
        label: "Sobre"
        file: "sobre.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Menu", name: "menu", widget: "string", required: false }
          - label: "Redirect From"
            name: "redirect_from"
            widget: "list"
            required: false
            hint: "URLs antigas que devem redirecionar para esta página"
          - { label: "Conteúdo", name: "body", widget: "markdown" }

      - name: "contato"
        label: "Contato"
        file: "contato.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Menu", name: "menu", widget: "string", required: false }
          - { label: "Conteúdo", name: "body", widget: "markdown" }

      - name: "leituras"
        label: "Leituras Recentes"
        file: "leituras.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Menu", name: "menu", widget: "string", required: false }
          - label: "Redirect From"
            name: "redirect_from"
            widget: "list"
            required: false
          - { label: "Conteúdo", name: "body", widget: "markdown" }

      - name: "livros-profissionais"
        label: "Livros para Profissionais"
        file: "livros-profissionais.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Conteúdo", name: "body", widget: "markdown" }

      - name: "livros-profissionais-marketing"
        label: "Livros de Marketing"
        file: "livros-profissionais-marketing.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Conteúdo", name: "body", widget: "markdown" }

      - name: "portfolio"
        label: "Portfolio"
        file: "portfolio.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Conteúdo", name: "body", widget: "markdown" }

      - name: "desconto-curso-pm3"
        label: "Desconto Curso PM3"
        file: "desconto-curso-pm3.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Conteúdo", name: "body", widget: "markdown" }

      - name: "colaboration"
        label: "Colaboração"
        file: "colaboration.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Conteúdo", name: "body", widget: "markdown" }

      - name: "product-stars"
        label: "Product Stars"
        file: "product-stars.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Conteúdo", name: "body", widget: "markdown" }

      - name: "links"
        label: "Links (/links)"
        file: "_data/links.yml"
        description: "Agregador de redes pessoais publicado em felipebarbosa.me/links"
        fields:
          - label: "Perfil"
            name: "profile"
            widget: "object"
            fields:
              - { label: "Headline", name: "headline", widget: "string", required: false }
              - label: "Intro"
                name: "intro"
                widget: "text"
                required: false
                hint: "Frase curta exibida abaixo do título da página."
              - { label: "Avatar", name: "avatar", widget: "string", required: false }
          - label: "Grupos de links"
            name: "groups"
            widget: "list"
            label_singular: "Grupo"
            summary: "{{fields.title}}"
            fields:
              - { label: "Título do grupo", name: "title", widget: "string" }
              - label: "Links"
                name: "items"
                widget: "list"
                label_singular: "Link"
                summary: "{{fields.label}}"
                fields:
                  - { label: "Texto", name: "label", widget: "string" }
                  - label: "URL"
                    name: "url"
                    widget: "string"
                    hint: "Interna começa com / (ex: /sobre/). Externa começa com https:// e abre em nova aba."
                  - { label: "Descrição", name: "description", widget: "string", required: false }
                  - label: "Ícone"
                    name: "icon"
                    widget: "select"
                    required: false
                    options: ["linkedin", "twitter", "github", "mail", "rss", "briefcase", "user", "folder", "pencil", "book", "mic"]
                  - label: "Destaque"
                    name: "featured"
                    widget: "boolean"
                    required: false
                    default: false
                    hint: "Card com fundo roxo, para o link mais importante do grupo."
                  - label: "Incluir no schema.org (sameAs)"
                    name: "sameas"
                    widget: "boolean"
                    required: false
                    default: false
                    hint: "Marque só para perfis seus em outras redes (LinkedIn, X, GitHub)."

      - name: "medium"
        label: "Medium"
        file: "medium.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Conteúdo", name: "body", widget: "markdown" }
