  str_ideas: "Deixe sua"
  str_ajuda: "Precisa de"

  # Colours, typography and padding
  # Open the "_sass > base" folder, and open "_variables.scss"
  google_fonts: "Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400"

  # Post navigation
  post_navigation: true

# PAGINATION
paginate: 5
paginate_path: "/page:num/"

# BUILD SETTINGS
markdown: kramdown
highlighter: rouge
sass:
  sass_dir: _sass
  style: :compressed
plugins: [jekyll-paginate, jekyll-sitemap, jekyll-redirect-from]
