# Conteúdo da página /links (agregador de redes e conteúdos).
# Editável também pelo Decap CMS em /admin → "Links (/links)".
#
# Cada item aceita:
#   label       (obrigatório) texto do link
#   url         (obrigatório) URL interna começando com "/" ou externa com "https://"
#   description (opcional)    linha de apoio abaixo do label
#   icon        (opcional)    nome do ícone: veja _includes/link-icon.html
#   featured    (opcional)    true = card em destaque (fundo roxo)
#   sameas      (opcional)    true = entra no schema.org sameAs (só perfis seus em outras redes)
#
# Links internos (começando com "/") abrem na mesma aba.
# Links externos abrem em nova aba com rel="noopener noreferrer".

profile:
  headline: "Marketing, Produto e Estratégia de Negócios."
  intro: "Todos os meus canais, conteúdos e formas de falar comigo em um lugar só."
  avatar: felipe_barbosa-logo-icon-alternative.png

groups:
