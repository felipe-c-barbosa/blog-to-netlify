    items:
      - label: "LinkedIn"
        description: "Onde eu posto com mais frequência"
        url: "https://www.linkedin.com/in/felipecardosobarbosa/"
        icon: linkedin
        sameas: true
        featured: true
      - label: "X / Twitter"
        url: "https://twitter.com/felipecb_"
        icon: twitter
        sameas: true
      - label: "GitHub"
        url: "https://github.com/felipe-c-barbosa"
        icon: github
