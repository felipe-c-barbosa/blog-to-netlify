<header class="site-header">
	<div class="branding">
		{% if site.theme_settings.gravatar %}
		<a href="{{ site.baseurl }}/">
			<img class="avatar" src="https://secure.gravatar.com/avatar/{{ site.theme_settings.gravatar }}?s=100" alt=""/>
		</a>
		{% elsif site.theme_settings.avatar %}
		<a href="{{ site.baseurl }}/">
			<img class="avatar" src="https://res.cloudinary.com/felipe-barbosa/image/upload/v1677279984/Brand%20Assets/{{ site.theme_settings.avatar }}" alt=""/>
		</a>
		{% endif %}
		<h1 class="site-title">
			<a href="{{ site.baseurl }}/">{{ site.theme_settings.title }}</a>
		</h1>
	</div>
	<button class="nav-toggle-btn" aria-label="Abrir menu" aria-expanded="false">
		<span></span>
		<span></span>
		<span></span>
	</button>
	<nav class="site-nav">
		<ul>
			{% for page in site.pages %}
			{% if page.menu and page.hide != true %}
			<li>
				<a class="page-link" href="{{ page.url | prepend: site.baseurl }}">
					{{ page.menu }}
				</a>
			</li>
			{% endif %}
			{% endfor %}
		</ul>
		<ul class="clearfix">
			<!-- Social icons from Font Awesome, if enabled -->
			{% include icons.html %}
		</ul>
	</nav>
</header>
<script>
	(function () {
		var btn = document.querySelector('.nav-toggle-btn');
		var nav = document.querySelector('.site-nav');
		if (!btn || !nav) return;

		btn.addEventListener('click', function () {
			var isOpen = nav.classList.toggle('is-open');
			btn.classList.toggle('is-open', isOpen);
			btn.setAttribute('aria-expanded', String(isOpen));
			btn.setAttribute('aria-label', isOpen ? 'Fechar menu' : 'Abrir menu');
		});

		document.addEventListener('click', function (e) {
			if (!e.target.closest('.site-header')) {
				nav.classList.remove('is-open');
				btn.classList.remove('is-open');
				btn.setAttribute('aria-expanded', 'false');
				btn.setAttribute('aria-label', 'Abrir menu');
			}
		});
	})();
</script>
